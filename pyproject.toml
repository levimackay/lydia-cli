[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lydia-cli"
version = "0.1.0"
description = "Lydia — a local AI coding agent powered by Ollama. No API keys required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Levi Mackay" }]
keywords = ["ai", "agent", "cli", "ollama", "coding-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
# Core install is deliberately lean — the coding agent, the REPL, semantic
# search, git/filesystem tools — so `pip install lydia-cli` stays a fast,
# small install for anyone who just wants that. The personal-assistant
# connectors and voice mode pull in genuinely heavy transitive deps
# (googleapiclient, pandas, onnxruntime, scipy — collectively several
# hundred MB) that most people trying the coding agent for the first time
# don't need on day one; see the [project.optional-dependencies] below.
# Every lazy import of an optional-extra package (see connectors/ and
# voice/) is function-scoped, never at module load time, so the base
# install runs the agent/REPL/tools fine with none of these present —
# only the specific optional feature fails, with a message pointing at
# which extra to install (see cli/optional_deps.py::require_extra).
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "httpx>=0.27",
    "pyfiglet>=1.0",
    "numpy>=1.26",
    "keyring>=25.0",
]

[project.optional-dependencies]
assistant = [
    "yfinance>=0.2",
    "feedparser>=6.0",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "msal>=1.30",
]
voice = [
    "sounddevice>=0.4",
    "openwakeword>=0.6",
    "faster-whisper>=1.0",
]
all = [
    "lydia-cli[assistant,voice]",
]
dev = [
    "lydia-cli[assistant,voice]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/levimackay/lydia-cli"

[project.scripts]
lydia = "lydia.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lydia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
